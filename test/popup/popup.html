<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polyglot Page Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-title">Polyglot Page Translator (Test)</span>
      </div>
      <button id="btn-options" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Main Controls -->
    <main class="content">
      <!-- Target Language Selection -->
      <div class="field-group">
        <label for="select-target-lang" class="field-label">Translate Into</label>
        <select id="select-target-lang" class="select-control"></select>
      </div>

      <!-- Display Mode Selector -->
      <div class="field-group">
        <label class="field-label">Display Mode</label>
        <div class="segmented-control">
          <label class="segment-option">
            <input type="radio" name="displayMode" value="replace" id="mode-replace" checked>
            <span class="segment-label">Replace</span>
          </label>
          <label class="segment-option">
            <input type="radio" name="displayMode" value="bilingual" id="mode-bilingual">
            <span class="segment-label">Bilingual</span>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-row">
        <button id="btn-translate" class="btn btn-primary" style="width: 100%;">Translate Page</button>
      </div>

      <!-- Multi-Language Statistics Card -->
      <section id="stats-panel" class="stats-panel">
        <div class="stats-header">
          <span class="stats-title">Detected Languages</span>
          <span id="stats-total" class="stats-badge">0 Blocks</span>
        </div>
        <div id="stats-list" class="stats-chips">
          <span class="stats-empty">Click "Translate Page" to detect and translate all languages on this page.</span>
        </div>
      </section>

      <!-- Domain Auto-Translate Toggle -->
      <div class="toggle-row">
        <label class="toggle-label" for="chk-auto-domain">
          <input type="checkbox" id="chk-auto-domain">
          <span class="toggle-text" id="auto-domain-label">Always translate this site</span>
        </label>
      </div>
    </main>

    <!-- Status Bar / Footer -->
    <footer class="footer">
      <span id="status-indicator" class="status-indicator">Ready</span>
      <span id="engine-badge" class="engine-badge">Google</span>
    </footer>
  </div>

  <script src="../lib/languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
